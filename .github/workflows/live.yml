# Weekly check that the search engines still answer and still parse.
#
# The regular test suite runs against saved result pages, so an engine that
# changes its markup or starts serving decoys goes unnoticed until someone
# looks. This asks the real endpoints. Engines refusing GitHub's runners
# outright are skipped with the reason; anything else that is not an on-topic
# answer fails the run.
name: live engines

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Engine status
        run: uv run webless doctor
        continue-on-error: true  # the summary table; the tests below decide pass/fail
      - name: Live tests
        run: uv run pytest -m live -v -rs
